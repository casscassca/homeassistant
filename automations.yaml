- id: reolink_front_door_activity
  alias: Reolink Front Door - Activity Detected
  description: ''
  triggers:
  - entity_id:
    - binary_sensor.front_door_person
    - binary_sensor.front_door_vehicle
    - binary_sensor.front_door_visitor
    - binary_sensor.front_door_pet
    to: 'on'
    trigger: state
  conditions:
  - condition: template
    value_template: '{{ (as_timestamp(now()) - as_timestamp(states.binary_sensor.front_door_contact.last_changed))
      > 30 }}'
  - condition: template
    value_template: '{{ (as_timestamp(now()) - as_timestamp(states.cover.ratgdo_door.last_changed))
      > 120 }}'
  - condition: template
    value_template: '{{ this.attributes.last_triggered is none or (as_timestamp(now())
      - as_timestamp(this.attributes.last_triggered)) > 120 }}'
  actions:
  - action: camera.snapshot
    data:
      filename: /config/www/snapshots/front_door_latest.jpg
    target:
      entity_id: camera.front_door_snapshots_fluent
  - delay:
      seconds: 2
  - action: notify.mobile_app_pixel
    data:
      data:
        clickAction: /front-yard-view/default_view
        image: /local/snapshots/front_door_latest.jpg
      message: Detected at the front door.
      title: Front Door - {{ trigger.to_state.name }}
  - action: notify.mobile_app_jason_s_iphone
    data:
      data:
        image: https://home.jassie.us/local/snapshots/front_door_latest.jpg
        url: https://home.jassie.us/front-yard-view/default_view
      message: Detected at the front door.
      title: Front Door - {{ trigger.to_state.name }}
  max_exceeded: silent
  mode: single
- id: petlibro_cleaning_reset_after_sweepy
  alias: Reset Petlibro cleaning state after Clean setup
  description: ''
  triggers:
  - trigger: state
    entity_id: sensor.juicebox_sweepy_clean_setup_last_done
  conditions:
  - condition: template
    value_template: >-
      {{ trigger.from_state is not none
         and trigger.to_state is not none
         and trigger.from_state.state not in ['unknown', 'unavailable']
         and trigger.to_state.state not in ['unknown', 'unavailable']
         and trigger.from_state.state != trigger.to_state.state }}
  actions:
  - action: rest_command.petlibro_cleaning_reset
    data:
      device_sn: "{{ states('input_text.petlibro_wet_food_device_sn') }}"
      request_id: "{{ context.id | replace('-', '') }}"
  mode: single
