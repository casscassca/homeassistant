- id: reolink_front_door_activity
  alias: Reolink Front Door - Activity Detected
  description: ''
  triggers:
  - entity_id:
    - binary_sensor.frontyard_door_person
    - binary_sensor.frontyard_door_vehicle
    - binary_sensor.frontyard_door_visitor
    - binary_sensor.frontyard_door_pet
    to: 'on'
    trigger: state
  conditions:
  - condition: template
    value_template: '{{ (as_timestamp(now()) - as_timestamp(states.binary_sensor.entry_front_contact.last_changed))
      > 30 }}'
  - condition: template
    value_template: '{{ (as_timestamp(now()) - as_timestamp(states.cover.garage_door.last_changed))
      > 120 }}'
  - condition: template
    value_template: '{{ this.attributes.last_triggered is none or (as_timestamp(now())
      - as_timestamp(this.attributes.last_triggered)) > 120 }}'
  actions:
  - action: script.notify_security_snapshot
    data:
      camera_id: camera.frontyard_door_snapshots_fluent
      snapshot_prefix: front_door
      title: Front Door - {{ trigger.to_state.name if 'to_state' in trigger else 'Activity' }}
      message: Detected at the front door.
      view_path: /front-yard-view/default_view
  max_exceeded: silent
  mode: single
- id: petlibro_cleaning_reset_after_sweepy
  alias: Reset Petlibro cleaning state after Clean setup
  description: ''
  triggers:
  - trigger: state
    entity_id: sensor.juicebox_clean_setup_last_done
  conditions:
  - condition: template
    value_template: >-
      {{ trigger.from_state is not none
         and trigger.to_state is not none
         and trigger.from_state.state not in ['unknown', 'unavailable']
         and trigger.to_state.state not in ['unknown', 'unavailable']
         and trigger.from_state.state != trigger.to_state.state }}
  actions:
  - action: rest_command.petlibro_login
    response_variable: petlibro_login
  - variables:
      petlibro_login_status: "{{ petlibro_login.status | default('unknown') }}"
      petlibro_login_code: >-
        {% set raw = petlibro_login.content %}
        {% if raw is mapping %}
          {{ raw.get('code', 'not returned') }}
        {% elif raw is string %}
          {{ (raw | from_json).get('code', 'not returned') }}
        {% else %}
          not returned
        {% endif %}
      petlibro_token: >-
        {% set raw = petlibro_login.content %}
        {% if raw is mapping %}
          {{ (raw.get('data') or {}).get('token', '') }}
        {% elif raw is string %}
          {{ ((raw | from_json).get('data') or {}).get('token', '') }}
        {% else %}
        {% endif %}
  - choose:
    - conditions:
      - condition: template
        value_template: >-
          {{ petlibro_login_status | int(0) >= 200
             and petlibro_login_status | int(0) < 300
             and petlibro_login_code | string == '0'
             and petlibro_token | length > 0 }}
      sequence:
      - action: rest_command.petlibro_cleaning_reset
        data:
          token: "{{ petlibro_token }}"
          device_sn: "{{ states('input_text.petlibro_wet_food_device_sn') }}"
          request_id: "{{ context.id | replace('-', '') }}"
        response_variable: petlibro_response
      - variables:
          petlibro_api_status: "{{ petlibro_response.status | default('unknown') }}"
          petlibro_api_code: >-
            {% set raw = petlibro_response.content %}
            {% if raw is mapping %}
              {{ raw.get('code', 'not returned') }}
            {% elif raw is string %}
              {{ (raw | from_json).get('code', 'not returned') }}
            {% else %}
              not returned
            {% endif %}
      - choose:
        - conditions:
          - condition: template
            value_template: >-
              {{ petlibro_api_status | int(0) >= 200
                 and petlibro_api_status | int(0) < 300
                 and petlibro_api_code | string == '0' }}
          sequence:
          - action: logbook.log
            data:
              name: Petlibro cleaning reset
              message: >-
                API reset returned HTTP {{ petlibro_api_status }}
                with API code {{ petlibro_api_code }}.
        default:
        - action: persistent_notification.create
          data:
            title: Petlibro cleaning reset failed
            message: >-
              API reset returned HTTP {{ petlibro_api_status }}
              with API code {{ petlibro_api_code }}.
    default:
    - action: persistent_notification.create
      data:
        title: Petlibro login failed
        message: >-
          Login returned HTTP {{ petlibro_login_status }}
          with API code {{ petlibro_login_code }}.
  mode: single
- id: google_assistant_sync_on_start
  alias: Sync Google Assistant after Home Assistant starts
  description: ''
  triggers:
  - trigger: homeassistant
    event: start
  actions:
  - delay: 00:00:45
  - action: google_assistant.request_sync
    continue_on_error: true
  mode: single
