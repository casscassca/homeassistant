- actions:
  - action: notify.send_message
    data:
      message: Someone was seen on the backyard camera
      title: Person Spotted - Backyard
    target:
      entity_id:
      - notify.pixel
      - notify.jason_s_iphone
  alias: Nest Backyard - Person Detected
  conditions:
  - condition: template
    value_template: '{{ trigger.event.data.new_state.attributes.event_type == ''camera_person''
      }}'
  - condition: not
    conditions:
    - condition: state
      entity_id: person.cass
      state: home
    - condition: state
      entity_id: person.jason
      state: home
  - condition: state
    entity_id: input_boolean.vacation_mode
    state: 'off'
  description: ''
  id: '1782569285600'
  mode: single
  triggers:
  - event_data:
      entity_id: event.backyard_camera_motion
    event_type: state_changed
    trigger: event
