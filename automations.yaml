- actions:
  - action: script.notify_security_snapshot
    data:
      camera_id: camera.backyard
      snapshot_prefix: backyard
      title: Person Spotted - Backyard
      message: Someone was seen on the backyard camera
      view_path: /
  alias: Nest Backyard - Person Detected
  conditions:
  - condition: template
    value_template: '{{ trigger.event.data.new_state.attributes.event_type == ''camera_person''
      }}'
  - condition: not
    conditions:
    - condition: state
      entity_id: person.cass
      state: home
    - condition: state
      entity_id: person.jason
      state: home
  - condition: state
    entity_id: input_boolean.vacation_mode
    state: 'off'
  - condition: template
    value_template: '{{ this.attributes.last_triggered is none or (as_timestamp(now())
      - as_timestamp(this.attributes.last_triggered)) > 120 }}'
  description: ''
  id: '1782569285600'
  mode: single
  triggers:
  - event_data:
      entity_id: event.backyard_motion
    event_type: state_changed
    trigger: event
