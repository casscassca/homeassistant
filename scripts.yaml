good_morning_blinds:
  alias: Good Morning Blinds
  description: ''
  icon: mdi:sun-wireless-outline
  sequence:
  - action: cover.set_cover_position
    target:
      entity_id:
      - cover.bedroom_center_blind
      - cover.bedroom_left_blind
      - cover.bedroom_right_blind
    data:
      position: 100
  - action: cover.set_cover_position
    target:
      entity_id: cover.bedroom_side_top_blind
    data:
      position: 40
  - action: cover.set_cover_position
    target:
      entity_id: cover.bedroom_side_bottom_blind
    data:
      position: 0
  - delay: 00:00:02
  - action: cover.set_cover_position
    target:
      entity_id: cover.dining_main_top_blind
    data:
      position: 40
  - action: cover.set_cover_position
    target:
      entity_id: cover.dining_main_bottom_blind
    data:
      position: 0
  - delay: 00:00:02
  - action: cover.set_cover_position
    target:
      entity_id: cover.jason_office_main_top_blind
    data:
      position: 40
  - action: cover.set_cover_position
    target:
      entity_id: cover.jason_office_main_bottom_blind
    data:
      position: 0
  - delay: 00:00:02
  - action: cover.set_cover_position
    target:
      entity_id:
      - cover.living_room_center_blind
      - cover.living_room_left_blind
      - cover.living_room_right_blind
    data:
      position: 100
  - delay: 00:00:02
  - condition: state
    entity_id: input_boolean.guests_over
    state: 'off'
  - action: cover.set_cover_position
    target:
      entity_id:
      - cover.landing_big_top_blind
      - cover.cass_office_left_top_blind
      - cover.cass_office_right_top_blind
    data:
      position: 40
  - action: cover.set_cover_position
    target:
      entity_id:
      - cover.landing_big_bottom_blind
      - cover.cass_office_left_bottom_blind
      - cover.cass_office_right_bottom_blind
    data:
      position: 0
  - delay: 00:00:02
  - action: cover.set_cover_position
    target:
      entity_id: cover.landing_wide_blind
    data:
      position: 100

