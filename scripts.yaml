notify_security_snapshot:
  alias: Notify security snapshot
  description: ''
  sequence:
  - variables:
      snapshot_name: "{{ snapshot_prefix }}_{{ now().strftime('%Y%m%d_%H%M%S') }}_{{ context.id[-8:] }}"
  - action: camera.snapshot
    data:
      filename: /config/www/snapshots/{{ snapshot_name }}.jpg
    target:
      entity_id: "{{ camera_id }}"
  - delay:
      seconds: 2
  - action: notify.mobile_app_pixel
    data:
      data:
        clickAction: "{{ view_path }}"
        image: /local/snapshots/{{ snapshot_name }}.jpg
      message: "{{ message }}"
      title: "{{ title }}"
  - action: notify.mobile_app_jason_s_iphone
    data:
      data:
        image: https://home.jassie.us/local/snapshots/{{ snapshot_name }}.jpg
        url: https://home.jassie.us{{ view_path }}
      message: "{{ message }}"
      title: "{{ title }}"

camera_power_toggle:
  alias: Toggle camera power
  description: >-
    Save a still, then turn the Frigate camera off, or turn it back on.
    Off is the same as the power button in Frigate.
  icon: mdi:power
  mode: parallel
  max: 6
  fields:
    entity_id:
      name: Camera
      required: true
      selector:
        entity:
          domain: camera
  sequence:
  - choose:
    - conditions:
      - condition: template
        value_template: >-
          {{ states(entity_id) in ['idle', 'unavailable', 'unknown', 'off'] }}
      sequence:
      - action: camera.turn_on
        target:
          entity_id: "{{ entity_id }}"
    default:
    - action: camera.snapshot
      target:
        entity_id: "{{ entity_id }}"
      data:
        filename: /config/www/{{ entity_id.split('.')[1] }}_last.jpg
    - delay:
        seconds: 1
    - action: camera.turn_off
      target:
        entity_id: "{{ entity_id }}"

all_lights_off:
  alias: All lights off
  description: >-
    Turn off household lights and lighting switches, leaving camera
    floodlights, status LEDs, and the garage-door opener light alone.
  icon: mdi:lightbulb-off
  mode: single
  sequence:
  - action: light.turn_off
    target:
      entity_id: >
        {{ states.light
           | rejectattr('attributes.entity_id', 'defined')
           | map(attribute='entity_id')
           | reject('search', 'reolink|ratgdo')
           | list }}
  - action: switch.turn_off
    target:
      entity_id:
        - switch.frontyard_foyer
        - switch.kitchen_under_cabinet
        - switch.patio_main
        - switch.garage_sconces

bedtime_lights:
  alias: Bedtime lights
  description: >-
    Turn off household lights and lighting switches except the bedroom
    nightstand lamps. Leaves camera floodlights, status LEDs, and the
    garage-door opener light alone.
  icon: mdi:bed
  mode: single
  sequence:
  - variables:
      keep_on:
        - light.bedroom_cass_bedside
        - light.bedroom_jason_bedside
  - action: light.turn_off
    target:
      entity_id: >
        {{ states.light
           | rejectattr('attributes.entity_id', 'defined')
           | map(attribute='entity_id')
           | reject('in', keep_on)
           | reject('search', 'reolink|ratgdo')
           | list }}
  - action: switch.turn_off
    target:
      entity_id:
        - switch.frontyard_foyer
        - switch.kitchen_under_cabinet
        - switch.patio_main
        - switch.garage_sconces
