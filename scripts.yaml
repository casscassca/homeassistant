good_morning_blinds:
  alias: Good Morning Blinds
  description: ''
  icon: mdi:sun-wireless-outline
  sequence:
  - action: cover.set_cover_position
    target:
      entity_id:
      - cover.main_upper_center
      - cover.main_upper_left
      - cover.main_upper_right
    data:
      position: 100
  - action: cover.set_cover_position
    target:
      entity_id: cover.main_side_top
    data:
      position: 40
  - action: cover.set_cover_position
    target:
      entity_id: cover.main_side_bottom
    data:
      position: 0
  - delay: 00:00:02
  - action: cover.set_cover_position
    target:
      entity_id: cover.dining_top
    data:
      position: 40
  - action: cover.set_cover_position
    target:
      entity_id: cover.dining_bottom
    data:
      position: 0
  - delay: 00:00:02
  - action: cover.set_cover_position
    target:
      entity_id: cover.front_office_top
    data:
      position: 40
  - action: cover.set_cover_position
    target:
      entity_id: cover.front_office_bottom
    data:
      position: 0
  - delay: 00:00:02
  - action: cover.set_cover_position
    target:
      entity_id:
      - cover.upper_center
      - cover.upper_left
      - cover.upper_right
    data:
      position: 100
  - delay: 00:00:02
  - condition: state
    entity_id: input_boolean.guests_over
    state: 'off'
  - action: cover.set_cover_position
    target:
      entity_id:
      - cover.big_top
      - cover.cass_office_left_top
      - cover.cass_office_right_top
    data:
      position: 40
  - action: cover.set_cover_position
    target:
      entity_id:
      - cover.big_bottom
      - cover.cass_office_left_bottom
      - cover.cass_office_right_bottom
    data:
      position: 0
  - delay: 00:00:02
  - action: cover.set_cover_position
    target:
      entity_id: cover.wide
    data:
      position: 100

notify_security_snapshot:
  alias: Notify security snapshot
  description: ''
  sequence:
  - variables:
      snapshot_name: "{{ snapshot_prefix }}_{{ now().strftime('%Y%m%d_%H%M%S') }}_{{ context.id[-8:] }}"
  - action: camera.snapshot
    data:
      filename: /config/www/snapshots/{{ snapshot_name }}.jpg
    target:
      entity_id: "{{ camera_id }}"
  - delay:
      seconds: 2
  - action: notify.mobile_app_pixel
    data:
      data:
        clickAction: "{{ view_path }}"
        image: /local/snapshots/{{ snapshot_name }}.jpg
      message: "{{ message }}"
      title: "{{ title }}"
  - action: notify.mobile_app_jason_s_iphone
    data:
      data:
        image: https://home.jassie.us/local/snapshots/{{ snapshot_name }}.jpg
        url: https://home.jassie.us{{ view_path }}
      message: "{{ message }}"
      title: "{{ title }}"
