good_morning_blinds:
  alias: Good Morning Blinds
  description: ''
  icon: mdi:sun-wireless-outline
  sequence:
  - repeat:
      for_each:
      - scene: scene.server_room_gateway_dining_room_privacy
        wait: 14
      - scene: scene.server_room_gateway_office_privacy
        wait: 12
      - scene: scene.server_room_gateway_living_room_open
        wait: 20
      - scene: scene.server_room_gateway_main_bedroom_privacy
        wait: 16
      sequence:
      - action: scene.turn_on
        target:
          entity_id: '{{ repeat.item.scene }}'
      - delay:
          seconds: '{{ repeat.item.wait }}'
      - action: scene.turn_on
        target:
          entity_id: '{{ repeat.item.scene }}'
      - delay: 00:00:06
  - condition: state
    entity_id: input_boolean.guests_over
    state: 'off'
  - repeat:
      for_each:
      - scene: scene.server_room_gateway_lounge_privacy
        wait: 16
      - scene: scene.server_room_gateway_media_privacy
        wait: 16
      - scene: scene.server_room_gateway_dads_room_privacy
        wait: 16
      sequence:
      - action: scene.turn_on
        target:
          entity_id: '{{ repeat.item.scene }}'
      - delay:
          seconds: '{{ repeat.item.wait }}'
      - action: scene.turn_on
        target:
          entity_id: '{{ repeat.item.scene }}'
      - delay: 00:00:06

