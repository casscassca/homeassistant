good_morning_blinds:
  alias: Good Morning Blinds
  description: ''
  icon: mdi:sun-wireless-outline
  sequence:
  - repeat:
      for_each:
      - scene.server_room_gateway_main_bedroom_privacy
      - scene.server_room_gateway_dining_room_privacy
      - scene.server_room_gateway_office_privacy
      - scene.server_room_gateway_living_room_open
      sequence:
      - action: scene.turn_on
        target:
          entity_id: '{{ repeat.item }}'
      - delay: 00:00:03
  - condition: state
    entity_id: input_boolean.guests_over
    state: 'off'
  - repeat:
      for_each:
      - scene.server_room_gateway_lounge_privacy
      - scene.server_room_gateway_media_privacy
      - scene.server_room_gateway_dads_room_privacy
      sequence:
      - action: scene.turn_on
        target:
          entity_id: '{{ repeat.item }}'
      - delay: 00:00:03

good_night_blinds:
  alias: Good Night Blinds
  description: ''
  icon: mdi:weather-night
  sequence:
  - repeat:
