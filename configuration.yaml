
homeassistant:
  external_url: "https://home.jassie.us"
  internal_url: "http://192.168.4.58:8123"
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 127.0.0.1
    - ::1

google_assistant:
  project_id: he-voice-06a10
  service_account: !include SERVICE_ACCOUNT.JSON
  report_state: true
  expose_by_default: true

rest_command:
  sweepy_webhook:
    url: "https://sweepy.jassie.us/api/ha-webhook"
    method: POST
    headers:
      x-webhook-secret: "{{ secret }}"
    content_type: "application/json"
    payload: '{"action": "{{ action }}"}'
  petlibro_cleaning_reset:
    url: "https://api.us.petlibro.com/device/device/machineCleaningReset"
    method: POST
    headers:
      token: !secret petlibro_api_token
      source: "ANDROID"
      language: "EN"
      timezone: "America/Chicago"
      version: "1.3.45"
      Content-Type: "application/json"
    payload: >-
      {"deviceSn":"{{ device_sn }}","requestId":"{{ request_id }}","timeout":5000}

logger:
  default: warning
  logs:
    custom_components.petlibro: debug
