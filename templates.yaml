- switch:
  - name: Patio camera power
    unique_id: patio_camera_power
    icon: mdi:power
    state: "{{ states('camera.patio') in ['recording', 'streaming'] }}"
    turn_on:
      action: script.camera_power_toggle
      data:
        entity_id: camera.patio
    turn_off:
      action: script.camera_power_toggle
      data:
        entity_id: camera.patio
