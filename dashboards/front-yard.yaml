views:
  - title: Front Door
    path: default_view
    icon: mdi:cctv
    cards:
      - type: vertical-stack
        cards:
          - type: picture-entity
            entity: camera.frontyard_door_fluent
            name: Front Door
            camera_view: live
            show_state: true
          - type: entities
            title: Front Door Status
            entities:
              - binary_sensor.entry_front_contact
              - binary_sensor.frontyard_door_person
              - binary_sensor.frontyard_door_vehicle
              - binary_sensor.frontyard_door_visitor
      - type: picture-entity
        entity: camera.frontyard_driveway
        name: Driveway
        camera_view: live
        show_state: true
      - type: picture-entity
        entity: camera.frontyard
        name: Front Yard
        camera_view: live
        show_state: true
