# Built-in cards only.
# Main view: live Frigate cameras in a 2-column grid, each with a small
# power toggle. The toggle calls script.camera_power_toggle, which saves a
# still to /config/www/<camera>_last.jpg then turns the camera off, or
# turns it back on. While off, the card shows that still via /local/.
# Tapping a camera opens its subview. Subviews are not in the nav.

views:
  - title: Security
    path: live
    icon: mdi:cctv
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: conditional
            conditions:
              - condition: or
                conditions:
                  - condition: state
                    entity: camera.patio
                    state: recording
                  - condition: state
                    entity: camera.patio
                    state: streaming
            grid_options:
              columns: 6
              rows: auto
            card:
              type: picture-glance
              title: Patio
              entity: camera.patio
              camera_image: camera.patio
              camera_view: live
              aspect_ratio: "16:9"
              fit_mode: cover
              tap_action:
                action: navigate
                navigation_path: /security-view/patio
              entities:
                - entity: camera.patio
                  icon: mdi:power
                  show_state: false
                  tap_action:
                    action: perform-action
                    perform_action: script.camera_power_toggle
                    data:
                      entity_id: camera.patio
          - type: conditional
            conditions:
              - condition: not
                conditions:
                  - condition: or
                    conditions:
                      - condition: state
                        entity: camera.patio
                        state: recording
