# Built-in cards only.
# Main view is a panel so the layout fills the screen width.
# A 3-column grid is used on wide screens (3 on top, 3 below).
# The built-in grid card keeps a fixed column count, so a second
# 1-column grid is shown on phones via a screen media query.
# Each cell is a live/still pair so a hidden conditional does not
# leave a gap. Camera cards use picture-glance with fit_mode cover
# so every tile fills the same 16:9 shape (cameras that send a
# taller picture are cropped, not letterboxed). The power icon is a
# template switch so glance places it in the toggle row, at the far
# right of the bottom bar. The toggle calls script.camera_power_toggle,
# which saves a still to /config/www/<camera>_last.jpg then turns the
# camera off, or turns it back on. While off, the card shows that still
# via /local/. Spacing comes from /local/security-spacing.css (padding
# on the panel view, inherited --grid-card-gap). Tapping a camera opens
# its subview. Subviews are also panels; their rows stack on a phone.
# Subviews are not in the nav.

views:
