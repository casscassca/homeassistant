    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: conditional
            conditions:
              - condition: or
                conditions:
                  - condition: state
                    entity: camera.patio
                    state: recording
                  - condition: state
                    entity: camera.patio
                    state: streaming
            grid_options:
              columns: 12
              rows: auto
            card:
              type: picture-glance
              title: Patio
              entity: camera.patio
              camera_image: camera.patio
              camera_view: live
              aspect_ratio: "16:9"
              fit_mode: cover
              tap_action:
                action: more-info
              entities:
                - entity: camera.patio
                  icon: mdi:power
                  show_state: false
                  tap_action:
                    action: perform-action
                    perform_action: script.camera_power_toggle
                    data:
                      entity_id: camera.patio
          - type: conditional
            conditions:
              - condition: not
                conditions:
                  - condition: or
                    conditions:
                      - condition: state
                        entity: camera.patio
                        state: recording
                      - condition: state
                        entity: camera.patio
                        state: streaming
            grid_options:
              columns: 12
              rows: auto
            card:
              type: picture-glance
              title: Patio
              entity: camera.patio
              image: /local/patio_last.jpg
              aspect_ratio: "16:9"
              fit_mode: cover
              tap_action:
                action: more-info
              entities:
                - entity: camera.patio
                  icon: mdi:power
                  show_state: false
                  tap_action:
                    action: perform-action
                    perform_action: script.camera_power_toggle
                    data:
                      entity_id: camera.patio
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Last person
            heading_style: subtitle
          - type: picture-entity
            entity: image.patio_person
            show_name: false
            show_state: false
            aspect_ratio: "16:9"
            fit_mode: cover
            tap_action:
              action: more-info
          - type: markdown
            content: >-
              {% set s = states('image.patio_person') %}
              {% if s not in ['unknown', 'unavailable', 'none', ''] %}
              {{ as_datetime(s).strftime('%-b %-d, %Y at %-I:%M %p') }}
              {% else %}
              No person snapshot yet
              {% endif %}

      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Person and motion
            heading_style: subtitle
          - type: history-graph
            hours_to_show: 24
            entities:
              - entity: binary_sensor.patio_person_occupancy
                name: Person
              - entity: binary_sensor.patio_motion
                name: Motion
            grid_options:
              columns: 12
              rows: 8
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Activity
            heading_style: subtitle
          - type: logbook
            hours_to_show: 24
            target:
              entity_id:
                - camera.patio
                - binary_sensor.patio_person_occupancy
                - binary_sensor.patio_motion
                - image.patio_person
            grid_options:
              columns: 12
              rows: 8
