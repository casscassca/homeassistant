# Built-in cards only.
# Main view is a panel so the layout fills the screen width.
# A 3-column grid is used on wide screens (3 on top, 3 below).
# The built-in grid card keeps a fixed column count, so a second
# 1-column grid is shown on phones via a screen media query.
# Each cell is a live/still pair so a hidden conditional does not
# leave a gap. The power icon sits on the right of the bottom bar
# (picture-glance entities). The toggle calls script.camera_power_toggle,
# which saves a still to /config/www/<camera>_last.jpg then turns the
# camera off, or turns it back on. While off, the card shows that still
# via /local/. Tapping a camera opens its subview. Subviews are also
# panels so the live view is full width; their rows stack on a phone.
# Subviews are not in the nav.

views:
  - title: Security
    path: live
    icon: mdi:cctv
    type: panel
    cards:
      - type: vertical-stack
        cards:
          - type: grid
            columns: 3
            square: false
            visibility:
              - condition: screen
                media_query: "(min-width: 800px)"
            cards:
              - type: vertical-stack
                cards:
                  - type: conditional
                    conditions:
                      - condition: or
                        conditions:
