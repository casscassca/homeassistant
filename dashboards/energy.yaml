views:
  - title: Electric
    path: electric
    icon: mdi:flash
    cards:
      - type: entities
        title: Vue
        entities:
          - entity: sensor.nikola_power_minute_average
            name: Power now
          - entity: sensor.nikola_energy_today
            name: Today
          - entity: sensor.nikola_energy_this_month
            name: This month
          - entity: sensor.balance_energy_today
            name: Unmonitored today
          - entity: sensor.balance_energy_this_month
            name: Unmonitored this month
      - type: entities
        title: Austin Energy
        entities:
          - entity: sensor.austin_energy_rate
            name: Current rate
          - entity: sensor.austin_energy_tier
            name: Tier
          - entity: sensor.elec_account_0641987895_current_bill_electric_usage_to_date
            name: Bill usage to date
          - entity: sensor.elec_account_0641987895_current_bill_electric_cost_to_date
            name: Bill cost to date
          - entity: sensor.elec_account_0641987895_current_bill_electric_forecasted_cost
            name: Forecasted bill
      - type: energy-date-selection
      - type: energy-usage-graph
        title: Usage
      - type: energy-sources-table
      - type: energy-devices-graph
        title: Circuits
      - type: energy-devices-detail-graph
        title: Circuit detail
  - title: History
    path: history
    icon: mdi:chart-bar
    cards:
      - type: statistics-graph
        title: Daily usage
        days_to_show: 60
        period: day
        stat_types:
          - change
        entities:
          - entity: sensor.nikola_energy_today
            name: House
      - type: statistics-graph
        title: Monthly usage
        days_to_show: 730
        period: month
        stat_types:
          - change
        entities:
          - entity: sensor.nikola_energy_this_month
            name: House
      - type: statistics-graph
        title: Power
        days_to_show: 2
        period: hour
        stat_types:
          - mean
        entities:
          - entity: sensor.nikola_power_minute_average
            name: Power
