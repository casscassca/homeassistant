# Built-in cards only. Per-camera On/Off uses camera.turn_on /
# camera.turn_off, the Home Assistant equivalent of Frigate's camera
# power button. That needs Frigate connected to MQTT.

views:
  - title: Cameras
    path: live
    icon: mdi:cctv
    cards:
      - type: heading
        heading: Camera power
        heading_style: title
      - type: markdown
        content: >
          Off is the same as the power button in Frigate — it stops
          decoding and recording for that camera. On turns it back on.
          Bins stays offline until its cable is fixed.
      - type: horizontal-stack
        cards:
          - type: tile
            entity: camera.patio
            name: Patio
            vertical: true
          - type: button
            name: Off
            icon: mdi:cctv-off
            tap_action:
              action: perform-action
              perform_action: camera.turn_off
              target:
                entity_id: camera.patio
          - type: button
            name: On
            icon: mdi:cctv
            tap_action:
              action: perform-action
              perform_action: camera.turn_on
              target:
                entity_id: camera.patio
      - type: tile
        entity: input_boolean.patio_privacy
        name: Patio privacy
        icon: mdi:eye-off
        vertical: false
      - type: horizontal-stack
        cards:
          - type: tile
            entity: camera.backyard
            name: Backyard
            vertical: true
          - type: button
            name: Off
            icon: mdi:cctv-off
            tap_action:
              action: perform-action
              perform_action: camera.turn_off
              target:
                entity_id: camera.backyard
          - type: button
            name: On
            icon: mdi:cctv
            tap_action:
              action: perform-action
              perform_action: camera.turn_on
              target:
                entity_id: camera.backyard
      - type: horizontal-stack
        cards:
          - type: tile
            entity: camera.backyard_bins
            name: Bins
            vertical: true
          - type: button
            name: Off
            icon: mdi:cctv-off
            tap_action:
              action: perform-action
              perform_action: camera.turn_off
              target:
                entity_id: camera.backyard_bins
          - type: button
            name: On
            icon: mdi:cctv
            tap_action:
              action: perform-action
              perform_action: camera.turn_on
              target:
                entity_id: camera.backyard_bins
      - type: horizontal-stack
        cards:
          - type: tile
            entity: camera.frontyard
            name: Frontyard
            vertical: true
          - type: button
            name: Off
            icon: mdi:cctv-off
            tap_action:
              action: perform-action
              perform_action: camera.turn_off
              target:
                entity_id: camera.frontyard
          - type: button
            name: On
            icon: mdi:cctv
            tap_action:
              action: perform-action
              perform_action: camera.turn_on
              target:
                entity_id: camera.frontyard
      - type: horizontal-stack
        cards:
          - type: tile
            entity: camera.frontyard_driveway
            name: Driveway
            vertical: true
          - type: button
            name: Off
            icon: mdi:cctv-off
            tap_action:
              action: perform-action
              perform_action: camera.turn_off
              target:
                entity_id: camera.frontyard_driveway
          - type: button
            name: On
            icon: mdi:cctv
            tap_action:
              action: perform-action
              perform_action: camera.turn_on
              target:
                entity_id: camera.frontyard_driveway
      - type: horizontal-stack
        cards:
          - type: tile
            entity: camera.frontyard_doorbell
            name: Doorbell
            vertical: true
          - type: button
            name: Off
            icon: mdi:cctv-off
            tap_action:
              action: perform-action
              perform_action: camera.turn_off
              target:
                entity_id: camera.frontyard_doorbell
          - type: button
            name: On
            icon: mdi:cctv
            tap_action:
              action: perform-action
              perform_action: camera.turn_on
              target:
                entity_id: camera.frontyard_doorbell
      - type: heading
        heading: Live
        heading_style: title
      - type: conditional
        conditions:
          - condition: state
            entity: input_boolean.patio_privacy
            state: "off"
        card:
          type: picture-entity
          entity: camera.patio
          name: Patio
          camera_view: live
          show_state: false
      - type: conditional
        conditions:
          - condition: state
            entity: input_boolean.patio_privacy
            state: "on"
        card:
          type: picture
          image: /local/patio_frozen.jpg
          alt: Patio (privacy still)
      - type: picture-entity
        entity: camera.backyard
        name: Backyard
        camera_view: live
        show_state: false
      - type: picture-entity
        entity: camera.backyard_bins
        name: Bins
        camera_view: live
        show_state: false
      - type: picture-entity
        entity: camera.frontyard
        name: Frontyard
        camera_view: live
        show_state: false
      - type: picture-entity
        entity: camera.frontyard_driveway
        name: Driveway
        camera_view: live
        show_state: false
      - type: picture-entity
        entity: camera.frontyard_doorbell
        name: Doorbell
        camera_view: live
        show_state: false
